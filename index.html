<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearLetter - Instant Letter Helper</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .card { background: #ffffff; max-width: 440px; width: 100%; border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    h1 { color: #1d4ed8; text-align: center; margin: 0 0 6px 0; font-size: 26px; }
    .subtitle { text-align: center; color: #64748b; font-size: 13px; margin: 0 0 22px 0; }
    label.title { display: block; font-weight: 700; color: #334155; font-size: 14px; margin-bottom: 8px; }
    select { width: 100%; padding: 14px; border: 2px solid #bfdbfe; border-radius: 14px; font-size: 17px; font-weight: 600; background: #eff6ff; color: #1e293b; margin-bottom: 20px; }
    .camera-btn { display: block; width: 100%; background: #2563eb; color: #ffffff; text-align: center; font-weight: 700; font-size: 20px; padding: 20px 16px; border-radius: 18px; cursor: pointer; box-shadow: 0 6px 16px rgba(37,99,235,0.3); }
    .camera-btn:active { transform: scale(0.98); background: #1d4ed8; }
    .hidden { display: none !important; }
    #loading { text-align: center; margin: 28px 0; color: #1d4ed8; font-weight: 600; }
    .spinner { width: 42px; height: 42px; border: 4px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #resultBox { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
    .banner { padding: 16px; border-radius: 16px; font-weight: 700; text-align: center; font-size: 17px; }
    .urg-high { background: #fee2e2; color: #991b1b; }
    .urg-med { background: #fef3c7; color: #92400e; }
    .urg-low { background: #dcfce7; color: #166534; }
    .box { background: #f8fafc; padding: 16px; border-radius: 16px; border: 1px solid #e2e8f0; }
    .box-blue { background: #eff6ff; border-color: #bfdbfe; }
    .box-amber { background: #fffbeb; border-color: #fde68a; }
    .tag { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; display: block; margin-bottom: 4px; }
    .box-blue .tag { color: #2563eb; }
    .box-amber .tag { color: #b45309; }
    .box p, .box div { margin: 0; color: #1e293b; line-height: 1.5; font-size: 15px; white-space: pre-line; }
    .actions-row { display: flex; gap: 10px; margin-top: 6px; }
    .btn-sec { flex: 1; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 16px; color: #ffffff; cursor: pointer; }
    .btn-dark { background: #1e293b; }
    .btn-green { background: #16a34a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📄 ClearLetter</h1>
    <p class="subtitle">100% Free & Private • Photos are never saved</p>

    <label class="title">1. Choose Your Language:</label>
    <select id="lang">
      <option value="Arabic">🇸🇦 العربية (Arabic)</option>
      <option value="Ukrainian">🇺🇦 Українська (Ukrainian)</option>
      <option value="Farsi">🇮🇷 فارسی (Farsi / Dari)</option>
      <option value="Tigrinya">🇪🇷 ትግርኛ (Tigrinya)</option>
      <option value="Turkish">🇹🇷 Türkçe (Turkish)</option>
      <option value="French">🇫🇷 Français (French)</option>
      <option value="English">🇬🇧 English</option>
    </select>

    <label class="camera-btn">
      📷 Take Photo of Letter
      <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden" onchange="processLetter(event)" />
    </label>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Reading letter & checking what to do...</p>
    </div>

    <div id="resultBox" class="hidden">
      <div id="urgencyBanner" class="banner"></div>
      <div class="box">
        <span class="tag">From Organization</span>
        <p id="senderText" style="font-weight:700; font-size:17px;"></p>
      </div>
      <div class="box">
        <span class="tag">What This Letter Means</span>
        <p id="summaryText"></p>
      </div>
      <div class="box box-blue">
        <span class="tag">✅ What You Must Do Now</span>
        <div id="actionText" style="font-weight:600;"></div>
      </div>
      <div class="box box-amber">
        <span class="tag">🗣️ Who to Ask & What to Show Them</span>
        <p id="scriptText" style="font-weight:600;"></p>
      </div>
      <div class="actions-row">
        <button onclick="speakResult()" class="btn-sec btn-dark">🔊 Listen</button>
        <button onclick="shareWhatsApp()" class="btn-sec btn-green">📲 Share Help</button>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "PASTE_YOUR_API_KEY_HERE";
    let fullSpokenText = "";

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxW = 1000;
            const scale = maxW / img.width;
            canvas.width = maxW;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.7).split(",").at(1));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function processLetter(event) {
      const file = event.target.files.item(0);
      if (!file) return;

      const today = new Date().toDateString();
      const usage = JSON.parse(localStorage.getItem("letterUsage") || '{"date":"","count":0}');
      if (usage.date === today && usage.count >= 5) {
        alert("You reached the 5 free letters limit for today. Try again tomorrow!");
        return;
      }

      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("resultBox").classList.add("hidden");

      const base64Image = await compressImage(file);
      const userLang = document.getElementById("lang").value;

      const prompt = `You are an expert European bureaucracy assistant helping newcomers. Analyze this official letter. Respond strictly in JSON format in ${userLang} (except the local helper phrase which should include the letter's original language like Dutch/German/French so they can show a worker).
      Return ONLY valid JSON with these exact keys:
      {
        "urgency": "HIGH" or "MEDIUM" or "LOW",
        "urgency_label": "Short status + any deadline date in ${userLang}",
        "sender": "Organization name and what they do in ${userLang}",
        "summary": "2-3 very simple sentences explaining the letter in ${userLang}",
        "actions": "Numbered list of exact steps to take and documents needed in ${userLang}",
        "help_script": "Who to visit (e.g. COA, IND, Jobcenter, GZA) + a polite 2-sentence message in the letter's original language to show them"
      }`;

      try {
        const res = await fetch(`https://googleapis.com{API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64Image } }
              ]
            }],
            generationConfig: { response_mime_type: "application/json" }
          })
        });

        const data = await res.json();
        const resultText = data.candidates.at(0).content.parts.at(0).text;
        const result = JSON.parse(resultText);

        localStorage.setItem("letterUsage", JSON.stringify({
          date: today,
          count: usage.date === today ? usage.count + 1 : 1
        }));

        const banner = document.getElementById("urgencyBanner");
        banner.innerText = result.urgency_label;
        banner.className = "banner " + 
          (result.urgency === "HIGH" ? "urg-high" : 
           result.urgency === "MEDIUM" ? "urg-med" : "urg-low");

        document.getElementById("senderText").innerText = result.sender;
        document.getElementById("summaryText").innerText = result.summary;
        document.getElementById("actionText").innerText = result.actions;
        document.getElementById("scriptText").innerText = result.help_script;

        fullSpokenText = `${result.urgency_label}. ${result.summary}. ${result.actions}`;
        document.getElementById("resultBox").classList.remove("hidden");
      } catch (err) {
        alert("Busy right now or connection error. Please try again in a few seconds!");
      } finally {
        document.getElementById("loading").classList.add("hidden");
      }
    }

    function speakResult() {
      window.speechSynthesis.cancel();
      const msg = new SpeechSynthesisUtterance(fullSpokenText);
      window.speechSynthesis.speak(msg);
    }

    function shareWhatsApp() {
      const text = encodeURIComponent("I just used ClearLetter to translate and understand an official letter for free! Try it here: " + window.location.href);
      window.open(`https://wa.me{text}`, "_blank");
    }
  </script>
</body>
</html>
