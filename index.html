<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClearLetter - Global Letter & Voice Helper</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f1f5f9; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .card { background: #ffffff; max-width: 460px; width: 100%; border-radius: 24px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    h1 { color: #1d4ed8; text-align: center; margin: 0 0 4px 0; font-size: 26px; }
    .subtitle { text-align: center; color: #64748b; font-size: 13px; margin: 0 0 18px 0; }
    label.title { display: block; font-weight: 700; color: #334155; font-size: 14px; margin-bottom: 6px; }
    select, input[type="password"] { width: 100%; padding: 13px; border: 2px solid #bfdbfe; border-radius: 14px; font-size: 16px; font-weight: 600; background: #eff6ff; color: #1e293b; margin-bottom: 16px; }
    .btn-main { display: block; width: 100%; background: #2563eb; color: #ffffff; text-align: center; font-weight: 700; font-size: 19px; padding: 18px 16px; border-radius: 18px; cursor: pointer; box-shadow: 0 6px 16px rgba(37,99,235,0.28); border: none; }
    .btn-main:active { transform: scale(0.98); background: #1d4ed8; }
    .btn-voice { width: 100%; background: #0f172a; color: #ffffff; font-weight: 700; font-size: 17px; padding: 16px; border-radius: 16px; border: none; cursor: pointer; margin-top: 10px; }
    .btn-voice.listening { background: #dc2626; }
    .hidden { display: none !important; }
    #loading { text-align: center; margin: 22px 0; color: #1d4ed8; font-weight: 600; }
    .spinner { width: 40px; height: 40px; border: 4px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.9s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #errorBox { background: #fee2e2; color: #991b1b; padding: 14px; border-radius: 14px; margin-top: 14px; font-size: 14px; font-weight: 600; }
    #resultBox { margin-top: 22px; display: flex; flex-direction: column; gap: 12px; }
    .banner { padding: 14px; border-radius: 14px; font-weight: 700; text-align: center; font-size: 16px; }
    .urg-high { background: #fee2e2; color: #991b1b; }
    .urg-med { background: #fef3c7; color: #92400e; }
    .urg-low { background: #dcfce7; color: #166534; }
    .box { background: #f8fafc; padding: 15px; border-radius: 16px; border: 1px solid #e2e8f0; }
    .box-blue { background: #eff6ff; border-color: #bfdbfe; }
    .box-amber { background: #fffbeb; border-color: #fde68a; }
    .tag { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #64748b; display: block; margin-bottom: 4px; }
    .box-blue .tag { color: #2563eb; }
    .box-amber .tag { color: #b45309; }
    .box p, .box div { margin: 0; color: #1e293b; line-height: 1.5; font-size: 15px; white-space: pre-line; }
    .actions-row { display: flex; gap: 10px; margin-top: 4px; }
    .btn-sec { flex: 1; border: none; padding: 14px; border-radius: 14px; font-weight: 700; font-size: 15px; color: #ffffff; cursor: pointer; }
    .btn-dark { background: #1e293b; }
    .btn-green { background: #16a34a; }
    .divider { border-top: 1px solid #e2e8f0; margin: 22px 0 16px 0; padding-top: 16px; }
    #voiceBox { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 16px; padding: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📄 ClearLetter</h1>
    <p class="subtitle">Global Letter & Voice Helper • 100% Free & Private</p>

    <!-- One-time API Key setup saved safely on your device -->
    <div id="keySetup">
      <label class="title">🔑 Paste Google AI Studio Key (Saved on your device):</label>
      <input type="password" id="apiKeyInput" placeholder="Paste AIza... key here once" onchange="saveKey()" />
    </div>

    <label class="title">1. Select Your Language:</label>
    <select id="lang">
      <option value="Amharic|am-ET">🇪🇹 አማርኛ (Amharic)</option>
      <option value="Tigrinya|ti-ET">🇪🇹 ትግርኛ (Tigrinya)</option>
      <option value="Oromo|om-ET">🇪🇹 Afaan Oromoo (Oromo)</option>
      <option value="Somali|so-ET">🇪🇹 Soomaali (Somali)</option>
      <option value="Wolaytta|wal-ET">🇪🇹 Wolayttatto (Wolaytta)</option>
      <option value="Sidama|sid-ET">🇪🇹 Sidaamu Afoo (Sidama)</option>
      <option value="Afar|aa-ET">🇪🇹 Qafar af (Afar)</option>
      <option value="Arabic|ar-SA">🇸🇦 العربية (Arabic)</option>
      <option value="Ukrainian|uk-UA">🇺🇦 Українська (Ukrainian)</option>
      <option value="Farsi|fa-IR">🇮🇷 فارسی / دری (Farsi / Dari)</option>
      <option value="Pashto|ps-AF">🇦🇫 پښتو (Pashto)</option>
      <option value="Kurdish Kurmanji|ku-TR">☀️ Kurdî (Kurdish Kurmanji)</option>
      <option value="Kurdish Sorani|ckb-IQ">☀️ کوردی سۆرانی (Kurdish Sorani)</option>
      <option value="Turkish|tr-TR">🇹🇷 Türkçe (Turkish)</option>
      <option value="Russian|ru-RU">🇷🇺 Русский (Russian)</option>
      <option value="French|fr-FR">🇫🇷 Français (French)</option>
      <option value="Spanish|es-ES">🇪🇸 Español (Spanish)</option>
      <option value="Portuguese|pt-PT">🇵🇹 Português (Portuguese)</option>
      <option value="English|en-US">🇬🇧 English</option>
      <option value="Dutch|nl-NL">🇳🇱 Nederlands (Dutch)</option>
      <option value="German|de-DE">🇩🇪 Deutsch (German)</option>
      <option value="Italian|it-IT">🇮🇹 Italiano (Italian)</option>
      <option value="Polish|pl-PL">🇵🇱 Polski (Polish)</option>
      <option value="Romanian|ro-RO">🇷🇴 Română (Romanian)</option>
      <option value="Urdu|ur-PK">🇵🇰 اردو (Urdu)</option>
      <option value="Hindi|hi-IN">🇮🇳 हिन्दी (Hindi)</option>
      <option value="Bengali|bn-BD">🇧🇩 বাংলা (Bengali)</option>
      <option value="Swahili|sw-KE">🇰🇪 Kiswahili (Swahili)</option>
      <option value="Hausa|ha-NG">🇳🇬 Hausa</option>
      <option value="Yoruba|yo-NG">🇳🇬 Yorùbá</option>
      <option value="Chinese Mandarin|zh-CN">🇨🇳 中文 (Chinese)</option>
      <option value="Vietnamese|vi-VN">🇻🇳 Tiếng Việt (Vietnamese)</option>
    </select>

    <button type="button" class="btn-main" onclick="document.getElementById('imageInput').click()">
      📷 Capture Photo or Upload File
    </button>
    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="processLetter(event)" />

    <div id="errorBox" class="hidden"></div>

    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <p>Reading letter & checking what to do...</p>
    </div>

    <div id="resultBox" class="hidden">
      <div id="urgencyBanner" class="banner"></div>
      <div class="box">
        <span class="tag">From Organization</span>
        <p id="senderText" style="font-weight:700; font-size:17px;"></p>
      </div>
      <div class="box">
        <span class="tag">What This Letter Means</span>
        <p id="summaryText"></p>
      </div>
      <div class="box box-blue">
        <span class="tag">✅ What You Must Do Now</span>
        <div id="actionText" style="font-weight:600;"></div>
      </div>
      <div class="box box-amber">
        <span class="tag">🗣️ Who to Ask & What to Show Them</span>
        <p id="scriptText" style="font-weight:600;"></p>
      </div>
      <div class="actions-row">
        <button type="button" onclick="speakResult()" class="btn-sec btn-dark">🔊 Listen Out Loud</button>
        <button type="button" onclick="shareWhatsApp()" class="btn-sec btn-green">📲 Share Help</button>
      </div>
    </div>

    <div class="divider">
      <label class="title">2. Face-to-Face Live Voice Helper:</label>
      <select id="localLang" style="margin-bottom: 8px;">
        <option value="Dutch|nl-NL">🇳🇱 Local Person Speaks: Dutch (Nederlands)</option>
        <option value="German|de-DE">🇩🇪 Local Person Speaks: German (Deutsch)</option>
        <option value="French|fr-FR">🇫🇷 Local Person Speaks: French (Français)</option>
        <option value="English|en-US">🇬🇧 Local Person Speaks: English</option>
        <option value="Swedish|sv-SE">🇸🇪 Local Person Speaks: Swedish</option>
        <option value="Italian|it-IT">🇮🇹 Local Person Speaks: Italian</option>
        <option value="Spanish|es-ES">🇪🇸 Local Person Speaks: Spanish</option>
      </select>
      <button type="button" id="micBtn" onclick="startLiveVoice()" class="btn-voice">🎙️ Tap & Speak Now</button>
      <div id="voiceBox" class="hidden">
        <span class="tag" id="voiceStatus">Listening...</span>
        <p id="voiceOriginal" style="font-size:14px; color:#64748b; margin-bottom:6px;"></p>
        <p id="voiceTranslated" style="font-size:17px; font-weight:700; color:#1d4ed8;"></p>
      </div>
    </div>
  </div>

  <script>
    let fullSpokenText = "";

    // Load saved API key automatically
    window.onload = () => {
      const saved = localStorage.getItem("gemini_api_key");
      if (saved) document.getElementById("apiKeyInput").value = saved;
    };

    function saveKey() {
      const val = document.getElementById("apiKeyInput").value.trim();
      localStorage.setItem("gemini_api_key", val);
    }

    function showError(msg) {
      const errBox = document.getElementById("errorBox");
      errBox.innerText = "⚠️ " + msg;
      errBox.classList.remove("hidden");
    }

    function getLangParts(selectId) {
      const val = document.getElementById(selectId).value.split("|");
      return { name: val.at(0), code: val.at(1) };
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Could not read this file."));
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Please upload a valid photo (JPG or PNG)."));
